rules:
  - id: "SHC-001"
    topic: "cli:stdout-stderr"
    severity: "high"
    applies_to: ["all"]
    rule: "Stdout carries primary results, stderr carries diagnostics. The contract holds in automation and non-interactive runs."
    rationale: |
      Interleaving breaks pipes and log capture. Universal rule: any program
      that emits anything follows this.
    refs: ["CLI-005"]

  - id: "SHC-002"
    topic: "cli:exit-codes"
    severity: "high"
    applies_to: ["all"]
    rule: "Exit codes are part of the supported interface. Document or preserve success, usage-error, and failure semantics when changing commands."
    rationale: |
      Same argument as SHC-001 but for the other half of the contract.
    refs: ["CLI-006"]
